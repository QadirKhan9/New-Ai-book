<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication and Profile System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        .form-group input[type="checkbox"] {
            width: auto;
        }
        
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        .error {
            color: red;
            margin: 10px 0;
        }
        
        .success {
            color: green;
            margin: 10px 0;
        }
        
        .language-input {
            display: flex;
            gap: 10px;
        }
        
        .language-input input {
            flex: 1;
        }
        
        .language-list {
            margin-top: 10px;
        }
        
        .language-tag {
            display: inline-block;
            background-color: #e9ecef;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 20px;
        }
        
        .language-tag button {
            background: none;
            border: none;
            color: #007bff;
            font-size: 18px;
            padding: 0 5px;
            margin-left: 5px;
            cursor: pointer;
        }
        
        .checkbox-option {
            display: inline-block;
            margin-right: 15px;
        }
        
        .hardware-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        nav ul {
            list-style: none;
            padding: 0;
        }
        
        nav ul li {
            display: inline;
            margin-right: 20px;
        }
        
        nav ul li a {
            text-decoration: none;
            color: #007bff;
        }
        
        .dashboard-content {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        main {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>User Authentication and Profile System</h1>
            <p>Welcome to the user authentication and profile management system.</p>
            
            <nav>
                <ul>
                    <li><a href="/signup">Sign Up</a></li>
                    <li><a href="/signin">Sign In</a></li>
                    <li><a href="/profile">Profile</a></li>
                    <li><a href="/dashboard">Dashboard</a></li>
                </ul>
            </nav>
            
            <div id="content">
                <p>Select an option from the navigation menu to get started.</p>
            </div>
        </div>
    </div>

    <script>
        // Simple routing simulation
        function navigateTo(page) {
            const contentDiv = document.getElementById('content');
            
            switch(page) {
                case 'signup':
                    contentDiv.innerHTML = '<h2>Sign Up Page</h2><p>Sign up form would be rendered here.</p>';
                    break;
                case 'signin':
                    contentDiv.innerHTML = '<h2>Sign In Page</h2><p>Sign in form would be rendered here.</p>';
                    break;
                case 'profile':
                    contentDiv.innerHTML = '<h2>Profile Page</h2><p>Profile management form would be rendered here.</p>';
                    break;
                case 'dashboard':
                    contentDiv.innerHTML = '<h2>Dashboard Page</h2><p>Personalized dashboard would be rendered here.</p>';
                    break;
                default:
                    contentDiv.innerHTML = '<p>Select an option from the navigation menu to get started.</p>';
            }
        }
        
        // Add event listeners to navigation links
        document.querySelectorAll('nav ul li a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.getAttribute('href').substring(1); // Remove leading slash
                navigateTo(page);
            });
        });
    </script>
</body>
</html>
