openapi: 3.0.0
info:
  title: User Authentication and Profile API
  description: API for user authentication and profile management with Better-Auth and Neon Postgres
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://staging-api.example.com/v1
    description: Staging server

paths:
  /auth/signup:
    post:
      summary: Register a new user
      description: Creates a new user account with Better-Auth and stores profile data in Neon Postgres
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - software_level
                - programming_languages
                - hardware_knowledge
                - experience_level
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: User's password with minimum 8 characters
                software_level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                  description: User's software skill level
                programming_languages:
                  type: array
                  items:
                    type: string
                    description: Programming language the user knows
                  description: List of programming languages
                hardware_knowledge:
                  type: array
                  items:
                    type: string
                    enum: [IoT, Robotics, "PC Hardware", None]
                  description: List of hardware areas the user knows
                experience_level:
                  type: string
                  enum: [Student, Professional, Hobbyist]
                  description: User's experience level
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input or duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/signin:
    post:
      summary: Authenticate a user
      description: Authenticates a user with email and password, returns user data and profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  format: password
                  description: User's password
      responses:
        '200':
          description: User successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profile:
    get:
      summary: Get current user's profile
      description: Retrieves the profile data for the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update current user's profile
      description: Updates the profile data for the currently authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                software_level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                  description: User's software skill level
                programming_languages:
                  type: array
                  items:
                    type: string
                    description: Programming language the user knows
                  description: List of programming languages
                hardware_knowledge:
                  type: array
                  items:
                    type: string
                    enum: [IoT, Robotics, "PC Hardware", None]
                  description: List of hardware areas the user knows
                experience_level:
                  type: string
                  enum: [Student, Professional, Hobbyist]
                  description: User's experience level
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the user
        email:
          type: string
          format: email
          description: User's email address
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user account was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user account was last updated
        emailVerified:
          type: boolean
          description: Whether the user's email has been verified

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          description: Auto-incrementing primary key
        user_id:
          type: string
          description: Foreign key linking to the User entity
        software_level:
          type: string
          enum: [Beginner, Intermediate, Advanced]
          description: User's software skill level
        programming_languages:
          type: array
          items:
            type: string
          description: List of programming languages the user knows
        hardware_knowledge:
          type: array
          items:
            type: string
            enum: [IoT, Robotics, "PC Hardware", None]
          description: List of hardware areas the user knows
        experience_level:
          type: string
          enum: [Student, Professional, Hobbyist]
          description: User's experience level
        created_at:
          type: string
          format: date-time
          description: Timestamp when the profile was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the profile was last updated

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details